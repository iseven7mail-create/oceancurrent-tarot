<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>洋流牌卡放大與列印</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff0ce; color: #181a12; font: 16px/1.7 system-ui, sans-serif; }
    main { max-width: 1000px; margin: auto; padding: 24px; }
    h1 { margin: 8px 0; font-size: clamp(24px, 5vw, 36px); }
    a { color: inherit; }
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
    button, .line-link { border: 2px solid #181a12; padding: 12px 18px; background: #aed1b8; color: #181a12; font: inherit; font-weight: 700; box-shadow: 3px 3px #181a12; cursor: pointer; text-decoration: none; }
    button:disabled { cursor: wait; opacity: .65; }
    button:focus-visible, a:focus-visible { outline: 3px solid #f44c25; outline-offset: 4px; }
    .art { text-align: center; }
    #card-image { display: block; max-width: 100%; width: auto; max-height: 78vh; margin: 0 auto; }
    .art.expanded #card-image { width: 100%; max-height: none; }
    .support { margin-top: 28px; padding: 24px; border: 2px solid #181a12; background: #fffaeb; box-shadow: 5px 5px #181a12; }
    .support p { margin: 0 0 16px; }
    .line-link { display: inline-block; }
    #status { min-height: 1.7em; }
    [hidden] { display: none !important; }
    @page { size: A4 portrait; margin: 10mm; }
    @media print {
      body { background: white; }
      main { margin: 0; padding: 0; max-width: none; }
      .screen-only { display: none !important; }
      .art, .art.expanded { margin: 0; break-inside: avoid; }
      #card-image, .art.expanded #card-image { width: auto; height: 270mm; max-height: 270mm; max-width: 190mm; object-fit: contain; margin: 0 auto; }
    }
  </style>
  <script src="cards.js" defer></script>
  <script src="card-view.js?v=20261121" defer></script>
</head>
<body>
  <main>
    <header class="screen-only">
      <a href="index.html#collection">回到 78種暖流</a>
      <h1 id="card-name">洋流牌卡</h1>
      <p>放大欣賞牌面，或下載圖片、列印留存。</p>
    </header>
    <div class="toolbar screen-only" id="card-tools" hidden>
      <button type="button" id="zoom" aria-pressed="false">再放大牌卡</button>
      <button type="button" id="download">下載牌卡 PNG</button>
      <button type="button" id="print">列印牌卡</button>
    </div>
    <p class="screen-only" id="status" role="status" aria-live="polite">牌卡載入中…</p>
    <div class="art" id="card-art"><img id="card-image" alt="" hidden></div>
    <section class="support screen-only" aria-label="支持命理文創">
      <p>歡迎大家支持命理文創。如有捐款支持伯洋，出示捐款證明，即可到少甫老師官方 LINE 免費諮詢一題。</p>
      <p>「我們的市長沈伯洋，塔羅老師是少甫。」</p>
      <a class="line-link" href="https://line.me/R/ti/p/@158vkyka" target="_blank" rel="noopener noreferrer">加少甫老師的官方 LINE（@158vkyka）</a>
    </section>
  </main>
</body>
</html>
